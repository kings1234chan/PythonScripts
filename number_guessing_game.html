<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <!-- PyScript modern CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        /* Confetti particle animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 50;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="game-card" class="glass-card w-full max-w-lg rounded-3xl p-6 sm:p-8 text-gray-800 transition-all duration-300 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-900 flex items-center justify-center gap-2">
                <span>🎲</span> Number Guesser
            </h1>
            <p id="range-subtitle" class="text-indigo-600 font-medium text-sm sm:text-base mt-1">
                Guess the secret number between 1 and 100!
            </p>
        </div>

        <!-- Difficulty Selection -->
        <div class="mb-5">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2 text-center">Select Difficulty</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" py-click="set_difficulty_easy" id="btn-easy" class="diff-btn py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl border border-indigo-200 bg-white hover:bg-indigo-50 text-indigo-700 transition">
                    Easy (1-50)
                </button>
                <button type="button" py-click="set_difficulty_normal" id="btn-normal" class="diff-btn py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl bg-indigo-600 text-white shadow-md transition">
                    Normal (1-100)
                </button>
                <button type="button" py-click="set_difficulty_hard" id="btn-hard" class="diff-btn py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl border border-indigo-200 bg-white hover:bg-indigo-50 text-indigo-700 transition">
                    Hard (1-500)
                </button>
            </div>
        </div>

        <!-- Progress Bar (Attempts Left) -->
        <div class="mb-5">
            <div class="flex justify-between text-xs font-semibold text-gray-600 mb-1">
                <span>Attempts Used</span>
                <span id="attempts-count-text">0 / 7</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="space-y-3 mb-5">
            <div class="relative">
                <input type="number" id="guess-input" placeholder="Enter your guess..."
                       class="w-full px-4 py-3 sm:py-4 rounded-2xl border-2 border-indigo-200 focus:border-indigo-600 focus:outline-none text-xl font-bold text-center text-gray-800 shadow-inner"
                       min="1" max="100">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button type="button" py-click="make_guess" class="sm:col-span-2 py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bullseye"></i> Submit Guess
                </button>
                <button type="button" py-click="reset_game" class="py-3.5 px-4 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-amber-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>

        <!-- Dynamic Output Feedback Box -->
        <div id="output" class="p-4 rounded-2xl bg-indigo-50 border border-indigo-100 text-center text-gray-700 font-medium min-h-[80px] flex items-center justify-center shadow-sm">
            🎮 Welcome! Choose your difficulty or enter a number to start.
        </div>

        <!-- Guess History Chips -->
        <div class="mt-5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Previous Guesses</h3>
            <div id="history-container" class="flex flex-wrap gap-2 min-h-[32px] items-center">
                <span class="text-xs text-gray-400 italic">No guesses yet</span>
            </div>
        </div>
    </div>

    <!-- Web Audio Synthesizer & Helper Utilities -->
    <script>
        // Web Audio Effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'guess') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.2, now + idx * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                    o.start(now + idx * 0.1);
                    o.stop(now + idx * 0.1 + 0.2);
                });
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function triggerConfetti() {
            const colors = ['#6366f1', '#a855f7', '#ec4899', '#3b82f6', '#10b981', '#f59e0b'];
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (2 + Math.random() * 3) + 's';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }
        }

        function shakeCard() {
            const card = document.getElementById('game-card');
            card.classList.remove('shake');
            void card.offsetWidth; // Trigger reflow
            card.classList.add('shake');
        }

        // Attach Enter key support to guess input
        document.getElementById('guess-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                // Trigger PyScript handler
                const btn = document.querySelector('[py-click="make_guess"]');
                if (btn) btn.click();
            }
        });
    </script>

    <!-- PyScript Main Application Code -->
    <script type="py">
import random
from pyscript import document, window

# Application state
min_val = 1
max_val = 100
max_attempts = 7
attempts = 0
target_number = random.randint(min_val, max_val)
guess_history = []
is_game_over = False

def set_output(html_content):
    document.getElementById("output").innerHTML = html_content

def update_ui():
    global attempts, max_attempts
    # Update progress bar
    percent = (attempts / max_attempts) * 100
    progress = document.getElementById("progress-bar")
    progress.style.width = f"{percent}%"
    
    if percent > 75:
        progress.className = "bg-red-500 h-2.5 rounded-full transition-all duration-300"
    elif percent > 45:
        progress.className = "bg-amber-500 h-2.5 rounded-full transition-all duration-300"
    else:
        progress.className = "bg-indigo-600 h-2.5 rounded-full transition-all duration-300"

    document.getElementById("attempts-count-text").textContent = f"{attempts} / {max_attempts}"

def update_history():
    container = document.getElementById("history-container")
    if not guess_history:
        container.innerHTML = '<span class="text-xs text-gray-400 italic">No guesses yet</span>'
        return
        
    chips_html = ""
    for item in guess_history:
        val = item["val"]
        hint = item["hint"]
        if hint == "low":
            color = "bg-blue-100 text-blue-700 border-blue-200"
            icon = "↑"
        elif hint == "high":
            color = "bg-orange-100 text-orange-700 border-orange-200"
            icon = "↓"
        else:
            color = "bg-emerald-100 text-emerald-700 border-emerald-200"
            icon = "✓"
        chips_html += f'<span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-lg border {color}">{val} {icon}</span>'
    container.innerHTML = chips_html

def update_difficulty_buttons(active_id):
    btns = ["btn-easy", "btn-normal", "btn-hard"]
    for b_id in btns:
        btn = document.getElementById(b_id)
        if b_id == active_id:
            btn.className = "diff-btn py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl bg-indigo-600 text-white shadow-md transition"
        else:
            btn.className = "diff-btn py-2 px-3 text-xs sm:text-sm font-semibold rounded-xl border border-indigo-200 bg-white hover:bg-indigo-50 text-indigo-700 transition"

def set_difficulty(d_min, d_max, d_attempts, btn_id):
    global min_val, max_val, max_attempts
    min_val = d_min
    max_val = d_max
    max_attempts = d_attempts
    
    inp = document.getElementById("guess-input")
    inp.min = str(min_val)
    inp.max = str(max_val)
    inp.placeholder = f"Guess ({min_val}-{max_val})"
    document.getElementById("range-subtitle").textContent = f"Guess the secret number between {min_val} and {max_val}!"
    
    update_difficulty_buttons(btn_id)
    reset_game(None)

def set_difficulty_easy(e):
    set_difficulty(1, 50, 10, "btn-easy")

def set_difficulty_normal(e):
    set_difficulty(1, 100, 7, "btn-normal")

def set_difficulty_hard(e):
    set_difficulty(1, 500, 8, "btn-hard")

def make_guess(e):
    global attempts, is_game_over, target_number, guess_history
    
    if is_game_over:
        set_output('<div class="text-amber-600 font-bold">Game Over! Click Reset to play again.</div>')
        return

    input_elem = document.getElementById("guess-input")
    raw_val = input_elem.value.strip()

    if not raw_val:
        set_output('<div class="text-red-500 font-bold">Please enter a number!</div>')
        window.shakeCard()
        return

    try:
        guess = int(raw_val)
    except ValueError:
        set_output('<div class="text-red-500 font-bold">Invalid input! Enter a valid integer.</div>')
        window.shakeCard()
        return

    if guess < min_val or guess > max_val:
        set_output(f'<div class="text-red-500 font-bold">Please stay between {min_val} and {max_val}!</div>')
        window.shakeCard()
        return

    attempts += 1
    diff = abs(target_number - guess)
    
    # Proximity temperature feedback
    if diff > (max_val - min_val) * 0.4:
        temp = "🥶 Freezing!"
    elif diff > (max_val - min_val) * 0.2:
        temp = "❄️ Cold"
    elif diff > (max_val - min_val) * 0.1:
        temp = "🔥 Warm"
    else:
        temp = "💥 Boiling Hot!"

    input_elem.value = ""

    if guess == target_number:
        is_game_over = True
        guess_history.append({"val": guess, "hint": "correct"})
        update_history()
        update_ui()
        window.playSound('win')
        window.triggerConfetti()
        set_output(f'''
            <div class="text-emerald-700 font-bold text-lg">
                🎉 Spot on! You guessed it in <span class="text-indigo-900">{attempts}</span> attempt(s)!<br>
                <span class="text-sm font-normal text-emerald-600">The number was indeed {target_number}.</span>
            </div>
        ''')
    elif attempts >= max_attempts:
        is_game_over = True
        hint_type = "low" if guess < target_number else "high"
        guess_history.append({"val": guess, "hint": hint_type})
        update_history()
        update_ui()
        window.playSound('lose')
        window.shakeCard()
        set_output(f'''
            <div class="text-red-600 font-bold">
                💀 Game Over! You ran out of attempts.<br>
                <span class="text-gray-700 text-sm font-normal">The correct number was <b>{target_number}</b>.</span>
            </div>
        ''')
    else:
        window.playSound('guess')
        if guess < target_number:
            hint_type = "low"
            msg = f'📈 <b>Too low!</b> Try higher. <span class="text-xs text-gray-500 block mt-1">{temp}</span>'
        else:
            hint_type = "high"
            msg = f'📉 <b>Too high!</b> Try lower. <span class="text-xs text-gray-500 block mt-1">{temp}</span>'
        
        guess_history.append({"val": guess, "hint": hint_type})
        update_history()
        update_ui()
        set_output(f'<div class="text-indigo-800 font-medium">{msg}</div>')

def reset_game(e):
    global target_number, attempts, is_game_over, guess_history
    target_number = random.randint(min_val, max_val)
    attempts = 0
    is_game_over = False
    guess_history = []
    
    document.getElementById("guess-input").value = ""
    update_ui()
    update_history()
    set_output(f'<div class="text-indigo-700">🎮 New game started! Guess between {min_val} and {max_val}.</div>')

# Initialize defaults on start
update_ui()
    </script>
</body>
</html>
