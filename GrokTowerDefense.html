<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  h1 {
    margin-bottom: 8px;
    font-size: 1.8rem;
    color: #e94560;
    text-shadow: 0 0 10px #e94560aa;
  }
  #ui {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .stat {
    background: #16213e;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #0f3460;
    font-size: 1.1rem;
  }
  .stat span { color: #e94560; font-weight: bold; }
  button {
    background: #e94560;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #ff6b81; }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  #game-container {
    position: relative;
    border: 3px solid #0f3460;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 20px #0f346066;
  }
  canvas {
    display: block;
    background: #0f0f1a;
  }
  #tower-select {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tower-btn {
    background: #16213e;
    border: 2px solid #0f3460;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    min-width: 110px;
    transition: all 0.2s;
  }
  .tower-btn:hover, .tower-btn.selected {
    border-color: #e94560;
    background: #1f2b4d;
  }
  .tower-btn .name { font-weight: bold; color: #e94560; }
  .tower-btn .cost { font-size: 0.9rem; color: #aaa; }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 20px 40px;
    border-radius: 12px;
    font-size: 1.6rem;
    text-align: center;
    display: none;
    z-index: 10;
    border: 2px solid #e94560;
  }
  #instructions {
    margin-top: 14px;
    max-width: 700px;
    text-align: center;
    color: #aaa;
    font-size: 0.95rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>🏰 Tower Defense</h1>

  <div id="ui">
    <div class="stat">💰 Gold: <span id="gold">100</span></div>
    <div class="stat">❤️ Lives: <span id="lives">20</span></div>
    <div class="stat">🌊 Wave: <span id="wave">0</span></div>
    <div class="stat">⭐ Score: <span id="score">0</span></div>
    <button id="startBtn">Start Wave</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="message"></div>
  </div>

  <div id="tower-select">
    <div class="tower-btn selected" data-type="basic">
      <div class="name">Basic Tower</div>
      <div class="cost">50 gold</div>
    </div>
    <div class="tower-btn" data-type="sniper">
      <div class="name">Sniper Tower</div>
      <div class="cost">120 gold</div>
    </div>
    <div class="tower-btn" data-type="splash">
      <div class="name">Splash Tower</div>
      <div class="cost">180 gold</div>
    </div>
  </div>

  <div id="instructions">
    Click on the grass to place a tower. Towers shoot automatically at enemies on the path.<br>
    Survive as many waves as you can. Don't let enemies reach the end!
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const goldEl = document.getElementById('gold');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');
const scoreEl = document.getElementById('score');
const startBtn = document.getElementById('startBtn');
const messageEl = document.getElementById('message');

// Game state
let gold = 100;
let lives = 20;
let wave = 0;
let score = 0;
let selectedTower = 'basic';
let gameOver = false;
let waveInProgress = false;
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];

// Path (waypoints)
const path = [
  {x: 0, y: 250},
  {x: 150, y: 250},
  {x: 150, y: 100},
  {x: 350, y: 100},
  {x: 350, y: 400},
  {x: 550, y: 400},
  {x: 550, y: 200},
  {x: 700, y: 200},
  {x: 700, y: 350},
  {x: 800, y: 350}
];

// Tower definitions
const towerTypes = {
  basic: {
    cost: 50,
    range: 120,
    damage: 15,
    fireRate: 0.8, // shots per second
    color: '#4ecca3',
    projectileSpeed: 6,
    splash: 0
  },
  sniper: {
    cost: 120,
    range: 220,
    damage: 55,
    fireRate: 0.4,
    color: '#54a0ff',
    projectileSpeed: 10,
    splash: 0
  },
  splash: {
    cost: 180,
    range: 100,
    damage: 25,
    fireRate: 0.6,
    color: '#ff9f43',
    projectileSpeed: 5,
    splash: 60
  }
};

// Enemy types per wave
function getEnemyForWave(w) {
  if (w <= 3) return { hp: 40 + w * 15, speed: 1.2, reward: 12, color: '#ff6b6b', size: 14 };
  if (w <= 6) return { hp: 80 + w * 25, speed: 1.4, reward: 18, color: '#ee5a24', size: 16 };
  if (w <= 10) return { hp: 150 + w * 35, speed: 1.6, reward: 25, color: '#c44569', size: 18 };
  return { hp: 250 + w * 50, speed: 1.8 + Math.min(w * 0.05, 1), reward: 35, color: '#8e44ad', size: 20 };
}

// Grid for placement (to prevent overlapping)
const cellSize = 40;
const cols = Math.floor(canvas.width / cellSize);
const rows = Math.floor(canvas.height / cellSize);
const occupied = Array(rows).fill().map(() => Array(cols).fill(false));

// Mark path cells as occupied
function markPathOccupied() {
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 10);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      const col = Math.floor(x / cellSize);
      const row = Math.floor(y / cellSize);
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const r = row + dr, c = col + dc;
          if (r >= 0 && r < rows && c >= 0 && c < cols) occupied[r][c] = true;
        }
      }
    }
  }
}
markPathOccupied();

// Tower selection
document.querySelectorAll('.tower-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTower = btn.dataset.type;
  });
});

// Place tower
canvas.addEventListener('click', e => {
  if (gameOver || waveInProgress) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const col = Math.floor(x / cellSize);
  const row = Math.floor(y / cellSize);

  if (col < 0 || col >= cols || row < 0 || row >= rows) return;
  if (occupied[row][col]) return;

  const type = towerTypes[selectedTower];
  if (gold < type.cost) return;

  gold -= type.cost;
  updateUI();
  occupied[row][col] = true;

  towers.push({
    x: col * cellSize + cellSize / 2,
    y: row * cellSize + cellSize / 2,
    type: selectedTower,
    cooldown: 0,
    ...type
  });
});

// Start wave
startBtn.addEventListener('click', () => {
  if (waveInProgress || gameOver) return;
  wave++;
  waveInProgress = true;
  startBtn.disabled = true;
  updateUI();

  const enemyCount = 5 + wave * 2;
  const enemyData = getEnemyForWave(wave);
  let spawned = 0;

  const spawnInterval = setInterval(() => {
    if (spawned >= enemyCount || gameOver) {
      clearInterval(spawnInterval);
      return;
    }
    enemies.push({
      x: path[0].x,
      y: path[0].y,
      pathIndex: 0,
      hp: enemyData.hp,
      maxHp: enemyData.hp,
      speed: enemyData.speed,
      reward: enemyData.reward,
      color: enemyData.color,
      size: enemyData.size,
      progress: 0
    });
    spawned++;
  }, 700);
});

function updateUI() {
  goldEl.textContent = gold;
  livesEl.textContent = lives;
  waveEl.textContent = wave;
  scoreEl.textContent = score;
}

function showMessage(text, duration = 2000) {
  messageEl.textContent = text;
  messageEl.style.display = 'block';
  if (duration > 0) {
    setTimeout(() => {
      messageEl.style.display = 'none';
    }, duration);
  }
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!gameOver) {
    update(dt);
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // Move enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.pathIndex >= path.length - 1) {
      // Reached end
      lives--;
      updateUI();
      enemies.splice(i, 1);
      if (lives <= 0) {
        gameOver = true;
        showMessage('GAME OVER\nScore: ' + score, 0);
        startBtn.disabled = true;
      }
      continue;
    }

    const target = path[e.pathIndex + 1];
    const dx = target.x - e.x;
    const dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < e.speed) {
      e.x = target.x;
      e.y = target.y;
      e.pathIndex++;
    } else {
      e.x += (dx / dist) * e.speed;
      e.y += (dy / dist) * e.speed;
    }
  }

  // Towers shoot
  for (const t of towers) {
    t.cooldown -= dt;
    if (t.cooldown > 0) continue;

    let closest = null;
    let closestDist = Infinity;
    for (const e of enemies) {
      const d = distance(t, e);
      if (d <= t.range && d < closestDist) {
        closest = e;
        closestDist = d;
      }
    }

    if (closest) {
      t.cooldown = 1 / t.fireRate;
      projectiles.push({
        x: t.x,
        y: t.y,
        target: closest,
        speed: t.projectileSpeed,
        damage: t.damage,
        color: t.color,
        splash: t.splash
      });
    }
  }

  // Move projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (!enemies.includes(p.target) || p.target.hp <= 0) {
      projectiles.splice(i, 1);
      continue;
    }

    const dx = p.target.x - p.x;
    const dy = p.target.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < p.speed + p.target.size) {
      // Hit
      if (p.splash > 0) {
        for (const e of enemies) {
          if (distance(p.target, e) <= p.splash) {
            e.hp -= p.damage;
          }
        }
      } else {
        p.target.hp -= p.damage;
      }

      // Particles
      for (let k = 0; k < 6; k++) {
        particles.push({
          x: p.target.x,
          y: p.target.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 0.4,
          color: p.color
        });
      }

      projectiles.splice(i, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  }

  // Remove dead enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].hp <= 0) {
      gold += enemies[i].reward;
      score += enemies[i].reward * 2;
      updateUI();
      // death particles
      for (let k = 0; k < 10; k++) {
        particles.push({
          x: enemies[i].x,
          y: enemies[i].y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 0.6,
          color: enemies[i].color
        });
      }
      enemies.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Check if wave finished
  if (waveInProgress && enemies.length === 0 && projectiles.length === 0) {
    waveInProgress = false;
    startBtn.disabled = false;
    gold += 20 + wave * 5; // wave clear bonus
    updateUI();
    showMessage('Wave ' + wave + ' Cleared!');
  }
}

function draw() {
  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grass tiles
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!occupied[r][c]) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#1a3a2a' : '#163528';
        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
      }
    }
  }

  // Draw path
  ctx.strokeStyle = '#3d3d5c';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) {
    ctx.lineTo(path[i].x, path[i].y);
  }
  ctx.stroke();

  // Path border
  ctx.strokeStyle = '#2a2a40';
  ctx.lineWidth = 40;
  ctx.stroke();

  // Inner path
  ctx.strokeStyle = '#4a4a6a';
  ctx.lineWidth = 28;
  ctx.stroke();

  // Towers
  for (const t of towers) {
    // Range circle (subtle)
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.strokeStyle = t.color + '22';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Tower base
    ctx.beginPath();
    ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#2c3e50';
    ctx.fill();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Tower top
    ctx.beginPath();
    ctx.arc(t.x, t.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
  }

  // Enemies
  for (const e of enemies) {
    // Body
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Health bar
    const barW = 30;
    const barH = 5;
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x - barW / 2, e.y - e.size - 12, barW, barH);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(e.x - barW / 2, e.y - e.size - 12, barW * (e.hp / e.maxHp), barH);
  }

  // Projectiles
  for (const p of projectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life * 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Placement preview
  if (!waveInProgress && !gameOver) {
    // (optional visual feedback could be added)
  }
}

// Start
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
