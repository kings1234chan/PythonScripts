<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #e94560;
    text-shadow: 0 0 8px #e9456080;
  }
  #ui {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  #ui span { background: #16213e; padding: 6px 12px; border-radius: 6px; }
  #controls {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #0f3460;
    color: #fff;
    border: 2px solid #e94560;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #e94560; transform: scale(1.05); }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  button.active { background: #e94560; box-shadow: 0 0 12px #e94560; }
  #game-wrap {
    position: relative;
    border: 3px solid #0f3460;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 20px #0008;
  }
  canvas { display: block; background: #0d1b2a; cursor: crosshair; }
  #overlay {
    position: absolute;
    inset: 0;
    background: #000c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    color: #e94560;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay button { margin-top: 16px; pointer-events: auto; }
  .hint { font-size: 0.8rem; color: #8899aa; margin-top: 8px; max-width: 640px; text-align: center; }
</style>
</head>
<body>
  <h1>🛡️ Tower Defense</h1>
  <div id="ui">
    <span>💰 Gold: <b id="gold">100</b></span>
    <span>❤️ Lives: <b id="lives">20</b></span>
    <span>🌊 Wave: <b id="wave">0</b></span>
    <span>👾 Enemies: <b id="enemies">0</b></span>
  </div>
  <div id="controls">
    <button id="btn-basic" onclick="selectTower('basic')">Basic ($50)</button>
    <button id="btn-sniper" onclick="selectTower('sniper')">Sniper ($120)</button>
    <button id="btn-splash" onclick="selectTower('splash')">Splash ($180)</button>
    <button id="btn-start" onclick="startWave()">Start Wave</button>
    <button id="btn-sell" onclick="toggleSell()">Sell Mode</button>
  </div>
  <div id="game-wrap">
    <canvas id="c" width="720" height="480"></canvas>
    <div id="overlay">
      <div id="msg">Click Start Wave to begin!</div>
      <button onclick="restart()">Play Again</button>
    </div>
  </div>
  <p class="hint">
    Place towers on the grass (not the path). Towers auto-attack enemies in range.
    Survive as many waves as you can!
  </p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- PATH (waypoints) ----------
const path = [
  {x:0, y:240}, {x:120, y:240}, {x:120, y:80}, {x:280, y:80},
  {x:280, y:360}, {x:440, y:360}, {x:440, y:160}, {x:600, y:160},
  {x:600, y:400}, {x:720, y:400}
];

// ---------- STATE ----------
let gold = 100, lives = 20, wave = 0;
let towers = [], enemies = [], projectiles = [];
let selectedType = null, sellMode = false;
let spawning = false, gameOver = false, victory = false;
let frame = 0;

// ---------- TOWER DEFS ----------
const TOWER = {
  basic:  { cost:50,  range:90,  rate:35, dmg:12, color:'#4ecdc4', size:14, splash:0 },
  sniper: { cost:120, range:170, rate:70, dmg:45, color:'#ff6b6b', size:12, splash:0 },
  splash: { cost:180, range:80,  rate:50, dmg:18, color:'#feca57', size:16, splash:45 }
};

// ---------- ENEMY DEFS (scale with wave) ----------
function makeEnemy(type, progress=0) {
  const base = {
    normal: { hp:40,  speed:1.1, reward:12, color:'#e74c3c', r:10 },
    fast:   { hp:22,  speed:2.0, reward:10, color:'#9b59b6', r:8  },
    tank:   { hp:160, speed:0.55,reward:30, color:'#2ecc71', r:14 },
    boss:   { hp:600, speed:0.7, reward:100,color:'#f39c12', r:20 }
  }[type];
  const mult = 1 + (wave-1)*0.25;
  return {
    type, progress, maxHp: base.hp*mult, hp: base.hp*mult,
    speed: base.speed, reward: Math.floor(base.reward*(1+wave*0.1)),
    color: base.color, r: base.r, slow: 0
  };
}

// ---------- HELPERS ----------
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function posOnPath(p){
  let len=0, segs=[];
  for(let i=0;i<path.length-1;i++){
    const d=dist(path[i],path[i+1]);
    segs.push({d, from:path[i], to:path[i+1]});
    len+=d;
  }
  let t = Math.max(0,Math.min(1,p))*len;
  for(const s of segs){
    if(t<=s.d){
      const r=t/s.d;
      return {x:s.from.x+(s.to.x-s.from.x)*r, y:s.from.y+(s.to.y-s.from.y)*r};
    }
    t-=s.d;
  }
  return {...path[path.length-1]};
}
function pathLength(){
  let l=0; for(let i=0;i<path.length-1;i++) l+=dist(path[i],path[i+1]); return l;
}
const PATH_LEN = pathLength();

function isOnPath(x,y, margin=22){
  for(let i=0;i<path.length-1;i++){
    const a=path[i], b=path[i+1];
    const dx=b.x-a.x, dy=b.y-a.y;
    const len2=dx*dx+dy*dy;
    let t=((x-a.x)*dx+(y-a.y)*dy)/len2;
    t=Math.max(0,Math.min(1,t));
    const px=a.x+t*dx, py=a.y+t*dy;
    if(Math.hypot(x-px,y-py)<margin) return true;
  }
  return false;
}

function canPlace(x,y){
  if(isOnPath(x,y)) return false;
  for(const t of towers) if(dist(t,{x,y}) < t.size*2+4) return false;
  if(x<20||x>W-20||y<20||y>H-20) return false;
  return true;
}

// ---------- UI ----------
function updateUI(){
  document.getElementById('gold').textContent = gold;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = wave;
  document.getElementById('enemies').textContent = enemies.length;
  document.getElementById('btn-basic').disabled = gold < 50;
  document.getElementById('btn-sniper').disabled = gold < 120;
  document.getElementById('btn-splash').disabled = gold < 180;
  document.getElementById('btn-start').disabled = spawning || enemies.length>0 || gameOver;
}

function selectTower(type){
  selectedType = selectedType===type ? null : type;
  sellMode = false;
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
  if(selectedType) document.getElementById('btn-'+type).classList.add('active');
}

function toggleSell(){
  sellMode = !sellMode;
  selectedType = null;
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
  if(sellMode) document.getElementById('btn-sell').classList.add('active');
}

// ---------- WAVE ----------
function startWave(){
  if(spawning || enemies.length>0 || gameOver) return;
  wave++;
  spawning = true;
  const count = 6 + wave*2;
  let spawned = 0;
  const interval = setInterval(()=>{
    if(gameOver){ clearInterval(interval); return; }
    let type = 'normal';
    if(wave%5===0 && spawned===count-1) type='boss';
    else if(Math.random()<0.25) type='fast';
    else if(Math.random()<0.15) type='tank';
    enemies.push(makeEnemy(type));
    spawned++;
    if(spawned>=count){ clearInterval(interval); spawning=false; }
  }, 700 - Math.min(400, wave*20));
  updateUI();
}

// ---------- INPUT ----------
canvas.addEventListener('click', e=>{
  if(gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left)*(W/rect.width);
  const y = (e.clientY-rect.top)*(H/rect.height);

  if(sellMode){
    for(let i=towers.length-1;i>=0;i--){
      if(dist(towers[i],{x,y}) < towers[i].size+6){
        gold += Math.floor(TOWER[towers[i].type].cost * 0.6);
        towers.splice(i,1);
        updateUI();
        return;
      }
    }
    return;
  }

  if(!selectedType) return;
  const def = TOWER[selectedType];
  if(gold < def.cost) return;
  if(!canPlace(x,y)) return;
  gold -= def.cost;
  towers.push({
    x, y, type:selectedType, ...def,
    cooldown:0, angle:0
  });
  updateUI();
});

canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX-rect.left)*(W/rect.width);
  mouse.y = (e.clientY-rect.top)*(H/rect.height);
});
const mouse = {x:-100,y:-100};

// ---------- GAME LOOP ----------
function update(){
  if(gameOver) return;
  frame++;

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    const spd = e.speed * (e.slow>0 ? 0.5 : 1);
    e.progress += spd / PATH_LEN;
    if(e.slow>0) e.slow--;
    if(e.progress>=1){
      lives--;
      enemies.splice(i,1);
      if(lives<=0){ endGame(false); return; }
      updateUI();
      continue;
    }
    if(e.hp<=0){
      gold += e.reward;
      enemies.splice(i,1);
      updateUI();
    }
  }

  // towers
  for(const t of towers){
    t.cooldown = Math.max(0, t.cooldown-1);
    let target=null, best=Infinity;
    for(const e of enemies){
      const p = posOnPath(e.progress);
      const d = dist(t,p);
      if(d<=t.range && d<best){ best=d; target=e; }
    }
    if(target){
      const p = posOnPath(target.progress);
      t.angle = Math.atan2(p.y-t.y, p.x-t.x);
      if(t.cooldown===0){
        t.cooldown = t.rate;
        projectiles.push({
          x:t.x, y:t.y, tx:p.x, ty:p.y,
          target, dmg:t.dmg, splash:t.splash,
          color:t.color, speed:7, life:60
        });
      }
    }
  }

  // projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    if(p.target && p.target.hp>0){
      const pos = posOnPath(p.target.progress);
      p.tx=pos.x; p.ty=pos.y;
    }
    const dx=p.tx-p.x, dy=p.ty-p.y;
    const d=Math.hypot(dx,dy);
    if(d<8 || p.life--<=0){
      // hit
      if(p.splash>0){
        for(const e of enemies){
          const ep=posOnPath(e.progress);
          if(dist(ep,{x:p.tx,y:p.ty})<=p.splash) e.hp-=p.dmg;
        }
      } else if(p.target) {
        p.target.hp -= p.dmg;
      }
      projectiles.splice(i,1);
    } else {
      p.x += (dx/d)*p.speed;
      p.y += (dy/d)*p.speed;
    }
  }

  // win condition (simple)
  if(wave>=20 && enemies.length===0 && !spawning) endGame(true);
}

function endGame(win){
  gameOver = true;
  victory = win;
  const ov = document.getElementById('overlay');
  document.getElementById('msg').textContent = win
    ? `Victory! You survived ${wave} waves!`
    : `Game Over — reached wave ${wave}`;
  ov.classList.add('show');
}

function restart(){
  gold=100; lives=20; wave=0;
  towers=[]; enemies=[]; projectiles=[];
  selectedType=null; sellMode=false;
  spawning=false; gameOver=false; victory=false;
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
  updateUI();
}

// ---------- DRAW ----------
function draw(){
  ctx.clearRect(0,0,W,H);

  // grass background
  ctx.fillStyle = '#1b4332';
  ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle = '#2d6a4f33';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // path
  ctx.strokeStyle = '#495057';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  // path edge
  ctx.strokeStyle = '#343a40';
  ctx.lineWidth = 40;
  ctx.globalAlpha=0.4;
  ctx.stroke();
  ctx.globalAlpha=1;

  // start / end markers
  ctx.fillStyle='#00b894';
  ctx.beginPath(); ctx.arc(path[0].x,path[0].y,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d63031';
  ctx.beginPath(); ctx.arc(path[path.length-1].x,path[path.length-1].y,14,0,Math.PI*2); ctx.fill();

  // towers
  for(const t of towers){
    // range when selected / hover
    if(selectedType===t.type || (sellMode && dist(t,mouse)<t.size+8)){
      ctx.beginPath();
      ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.fillStyle = sellMode ? '#ff000022' : '#ffffff11';
      ctx.fill();
      ctx.strokeStyle = sellMode ? '#ff6666' : '#ffffff44';
      ctx.lineWidth=1;
      ctx.stroke();
    }
    // body
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.size,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#0008';
    ctx.lineWidth=2;
    ctx.stroke();
    // barrel
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.rotate(t.angle);
    ctx.fillStyle='#ddd';
    ctx.fillRect(0,-3,t.size+8,6);
    ctx.restore();
  }

  // placement preview
  if(selectedType && !sellMode){
    const def = TOWER[selectedType];
    const ok = canPlace(mouse.x,mouse.y) && gold>=def.cost;
    ctx.beginPath();
    ctx.arc(mouse.x,mouse.y,def.range,0,Math.PI*2);
    ctx.fillStyle = ok ? '#00ff0022' : '#ff000022';
    ctx.fill();
    ctx.strokeStyle = ok ? '#00ff0088' : '#ff000088';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.fillStyle = def.color + (ok?'cc':'66');
    ctx.beginPath();
    ctx.arc(mouse.x,mouse.y,def.size,0,Math.PI*2);
    ctx.fill();
  }

  // enemies
  for(const e of enemies){
    const p = posOnPath(e.progress);
    // health bar
    const bw=e.r*2.2;
    ctx.fillStyle='#333';
    ctx.fillRect(p.x-bw/2, p.y-e.r-10, bw, 5);
    ctx.fillStyle = e.hp/e.maxHp>0.5 ? '#2ecc71' : e.hp/e.maxHp>0.25 ? '#f1c40f' : '#e74c3c';
    ctx.fillRect(p.x-bw/2, p.y-e.r-10, bw*(e.hp/e.maxHp), 5);
    // body
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#0006';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  // projectiles
  for(const p of projectiles){
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
    // trail
    ctx.strokeStyle = p.color+'88';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x -
