<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Math Quiz</title>
<style>body{font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:linear-gradient(135deg,#667eea,#764ba2)}.game-container{background:white;padding:40px;border-radius:20px;text-align:center}h1{color:#333}#question{font-size:48px;color:#667eea;margin:30px 0}#answer{font-size:24px;padding:15px;width:150px;text-align:center;border:3px solid #667eea;border-radius:10px}button{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:15px 40px;font-size:18px;border-radius:10px;cursor:pointer;margin:10px}#score,#timer{font-size:24px;margin:15px 0}#result{font-size:20px;margin-top:20px;padding:15px;border-radius:10px}.correct{background:#d4edda;color:#155724}.wrong{background:#f8d7da;color:#721c24}</style></head>
<body><div class="game-container"><h1>🧮 Math Quiz</h1><div id="timer">Time: 60s</div><div id="score">Score: 0</div><div id="question">Press Start!</div><input type="number" id="answer" placeholder="?"><br><button onclick="checkAnswer()">Submit</button><button onclick="startGame()">Start</button><div id="result"></div></div>
<script>let score=0,timeLeft=60,correctAnswer=0,timer=null;function startGame(){score=0;timeLeft=60;document.getElementById('score').textContent='Score: 0';document.getElementById('result').textContent='';generateQuestion();if(timer)clearInterval(timer);timer=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent='Time: '+timeLeft+'s';if(timeLeft<=0){clearInterval(timer);document.getElementById('question').textContent='Game Over!';document.getElementById('result').textContent='Final Score: '+score;document.getElementById('result').className='correct'}},1000)}function generateQuestion(){const a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1,ops=['+','-','×'],op=ops[Math.floor(Math.random()*ops.length)];if(op==='+')correctAnswer=a+b;else if(op==='-')correctAnswer=a-b;else correctAnswer=a*b;document.getElementById('question').textContent=a+' '+op+' '+b+' = ?';document.getElementById('answer').value='';document.getElementById('answer').focus()}function checkAnswer(){if(timeLeft<=0)return;const userAnswer=parseInt(document.getElementById('answer').value);if(userAnswer===correctAnswer){score+=10;document.getElementById('score').textContent='Score: '+score;document.getElementById('result').textContent='✅ Correct!';document.getElementById('result').className='correct'}else{document.getElementById('result').textContent='❌ Wrong! Answer: '+correctAnswer;document.getElementById('result').className='wrong'}setTimeout(generateQuestion,800)}document.getElementById('answer').addEventListener('keypress',(e)=>{if(e.key==='Enter')checkAnswer()})</script></body></html>
