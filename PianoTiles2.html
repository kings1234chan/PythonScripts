<!DOCTYPE html>
<html>
<head>
<title>Piano Tiles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff;overflow:hidden}
#wrap{position:relative;width:320px;height:500px;background:#222;border:3px solid #444;border-radius:8px;overflow:hidden}
.tile{position:absolute;width:79px;height:120px;border-radius:6px;cursor:pointer;transition:background .1s;display:flex;align-items:center;justify-content:center;font-size:28px}
.tile.black{background:#111;border:1px solid #333}.tile.black:hover{background:#333}
.tile.hit{background:#4CAF50!important;transform:scale(0.95)}
.tile.miss{background:#f44!important}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;font-size:18px;font-weight:bold;z-index:10;background:rgba(0,0,0,0.6)}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#overlay h1{font-size:36px;margin-bottom:8px}
#overlay p{font-size:18px;color:#aaa;margin:4px}
#overlay button{margin-top:16px;padding:12px 40px;font-size:18px;border:none;border-radius:25px;cursor:pointer;background:#4CAF50;color:#fff;font-weight:bold}
#overlay button:hover{background:#66BB6A}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>🎵 <span id="sc">0</span></span><span id="msg">🎹 Piano Tiles</span><span>❤️ <span id="hp">3</span></span></div>
  <div id="overlay"><h1>🎹 Piano Tiles</h1><p>Press 1 2 3 4 or tap tiles!</p><p>Miss 3 and you're out 💀</p><button onclick="start()">Play 🎵</button></div>
</div>
<script>
var wrap=document.getElementById('wrap'),overlay=document.getElementById('overlay');
var notes='CDEFGAB',
    emojis=['🎵','🎶','🎸','🎺','🥁','📯','🎻','💀','🎤','💃','🕺','🔥','🌟','⭐'];
var tiles=[],score=0,hp=3,alive=false,speed=2,spawnTimer=0,animId;
var audioCtx=new(window.AudioContext||window.webkitAudioContext)();
var freqs={C:262,D:294,E:330,F:349,G:392,A:440,B:494};

function playNote(n){
    var o=audioCtx.createOscillator(),
        g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.value=freqs[n]*(Math.random()>0.5?1:2);
    g.gain.value=0.3;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4);
    o.stop(audioCtx.currentTime+0.4);
}

function spawn(){
    var col=Math.floor(Math.random()*4),
        note=notes[Math.floor(Math.random()*7)];
    var el=document.createElement('div');
    el.className='tile black';
    el.style.left=(col*79)+'px';
    el.style.top='-120px';
    el.innerHTML='<span style="font-size:28px">'
        +emojis[Math.floor(Math.random()*emojis.length)]
        +'</span><span style="position:absolute;bottom:6px;font-size:22px;font-weight:bold;color:#666">'
        +(col+1)+'</span>';
    el.onclick=function(){hitTile(col);};
    wrap.appendChild(el);
    tiles.push({el:el,y:-120,col:col,note:note});
}

function update(){
    if(!alive)return;
    spawnTimer++;
    if(spawnTimer>Math.max(25,60-score)){spawnTimer=0;spawn();}
    for(var i=tiles.length-1;i>=0;i--){
        tiles[i].y+=speed;
        tiles[i].el.style.top=tiles[i].y+'px';
        if(tiles[i].y>500){
            tiles[i].el.remove();
            tiles.splice(i,1);
            hp--;document.getElementById('hp').textContent=hp;
            document.getElementById('msg').textContent=
            ['Over!','Bruh!','Missed!','Ohio moment'][Math.floor(Math.random()*4)];
            if(hp<=0){alive=false;showEnd();}
        }
    }
    animId=requestAnimationFrame(update);
}

function showEnd(){
    window.parent.postMessage({score:score},'*');
    overlay.style.display='flex';
    overlay.innerHTML='<h1>💀 Game Over</h1><p>Score: '+score+'</p><p>'+
        (score<10?'Skill issue 💀':score<25?'Not bad 😏':score<50?
        'Sigma energy 🐺':'GOATE 🐐👑')+
        '</p><button onclick="start()">Again 🎵</button>';
}

function hitTile(col){
    if(!alive)return;
    var best=null;
    for(var i=0;i<tiles.length;i++){
        if(tiles[i].col===col&&(best===null||tiles[i].y>tiles[best].y))best=i;
    }
    if(best===null){
        hp--;document.getElementById('hp').textContent=hp;
        document.getElementById('msg').textContent=
        ['Wrong! 💀','No tile there!','Bruh 😭','L + ratio'][Math.floor(Math.random()*4)];
        if(hp<=0){alive=false;showEnd();}
        return;
    }
    var t=tiles[best];
    playNote(t.note);
    t.el.className='tile hit';
    score++;
    document.getElementById('sc').textContent=score;
    document.getElementById('msg').textContent=
        ['Nice!','Cool!','Wow!','Fire 🔥','Sigma'][Math.floor(Math.random()*5)];
    speed=2+score*0.05;
    t.el.remove();
    tiles.splice(best,1);
}

document.addEventListener('keydown',function(e){
    var k=e.key;if(k>='1'&&k<='4')hitTile(parseInt(k)-1);
});

function start(){
    overlay.style.display='none';
    score=0;hp=3;speed=2;spawnTimer=0;alive=true;
    document.getElementById('sc').textContent=0;
    document.getElementById('hp').textContent=3;
    document.getElementById('msg').textContent='Go!';
    tiles.forEach(function(t){t.el.remove();});tiles=[];
    cancelAnimationFrame(animId);
    update();
}
</script>
</body>
</html>
