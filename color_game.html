<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Matching Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        #color-display {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        #color-name {
            font-size: 40px;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 15px;
            letter-spacing: 2px;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        button {
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .color-btn {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .score-display {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .score-item {
            text-align: center;
        }
        .score-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        #message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct {
            background: #4caf50;
            color: white;
        }
        .wrong {
            background: #f44336;
            color: white;
        }
        .action-btn {
            grid-column: 1 / -1;
            background: #667eea;
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎨 Color Matching Game</h1>
        <p style="color: #666; margin-bottom: 10px;">Click the button that matches the circle's color!</p>
        
        <div class="score-display">
            <div class="score-item">
                <div>Score</div>
                <div class="score-number" id="score">0</div>
            </div>
            <div class="score-item">
                <div>High Score</div>
                <div class="score-number" id="high-score">0</div>
            </div>
            <div class="score-item">
                <div>Time</div>
                <div class="score-number" id="timer">30</div>
            </div>
        </div>
        
        <div id="color-display"></div>
        <div id="color-name">RED</div>
        
        <div class="buttons" id="color-buttons"></div>
        
        <div id="message"></div>
    </div>

    <script>
        const colors = [
            { name: 'RED', color: '#f44336' },
            { name: 'BLUE', color: '#2196F3' },
            { name: 'GREEN', color: '#4CAF50' },
            { name: 'YELLOW', color: '#FFEB3B' },
            { name: 'PURPLE', color: '#9C27B0' },
            { name: 'ORANGE', color: '#FF9800' }
        ];
        
        let score = 0;
        let highScore = localStorage.getItem('colorGameHighScore') || 0;
        let timeLeft = 30;
        let currentColor;
        let gameActive = true;
        let timerInterval;

        document.getElementById('high-score').innerText = highScore;
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        function generateRound() {
            if (!gameActive) return;

            // Pick random color to display
            currentColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('color-display').style.backgroundColor = currentColor.color;
            
            // Pick random text name for Stroop effect
            const displayName = colors[Math.floor(Math.random() * colors.length)].name;
            const nameEl = document.getElementById('color-name');
            nameEl.innerText = displayName;
            nameEl.style.color = currentColor.color;
            
            // Generate 4 answer buttons
            const shuffledColors = shuffleArray([...colors]).slice(0, 4);
            if (!shuffledColors.some(c => c.name === currentColor.name)) {
                shuffledColors[0] = currentColor;
            }
            shuffleArray(shuffledColors);
            
            const buttonsContainer = document.getElementById('color-buttons');
            buttonsContainer.innerHTML = '';
            
            shuffledColors.forEach(colorObj => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.innerText = colorObj.name;
                btn.style.backgroundColor = colorObj.color;
                btn.onclick = () => checkAnswer(colorObj.name);
                buttonsContainer.appendChild(btn);
            });
        }
        
        function checkAnswer(selectedColor) {
            if (!gameActive) return;
            
            const messageEl = document.getElementById('message');
            
            if (selectedColor === currentColor.name) {
                score++;
                document.getElementById('score').innerText = score;
                messageEl.innerHTML = '<div class="correct">✅ Correct!</div>';
            } else {
                messageEl.innerHTML = `<div class="wrong">❌ Wrong! It was ${currentColor.name}</div>`;
            }
            
            setTimeout(() => {
                if (!gameActive) return;
                messageEl.innerHTML = '';
                generateRound();
            }, 600);
        }
        
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                } else {
                    gameActive = false;
                    clearInterval(timerInterval);

                    // Update High Score
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('colorGameHighScore', highScore);
                        document.getElementById('high-score').innerText = highScore;
                    }

                    document.getElementById('message').innerHTML = 
                        `<div class="correct">🎉 Time's Up! Final Score: ${score}</div>`;
                    
                    document.getElementById('color-buttons').innerHTML = 
                        '<button class="action-btn" onclick="restartGame()">Play Again</button>';
                }
            }, 1000);
        }

        function restartGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('message').innerHTML = '';
            clearInterval(timerInterval);
            startTimer();
            generateRound();
        }
        
        // Start game initially
        startTimer();
        generateRound();
    </script>
</body>
</html>
